services:
  app:
    build: .
    image: gdns
    command: /docker-gdns
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis:6379
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672
    restart: unless-stopped
  test:
    image: gdns
    command: go test ./test

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6378:6379"
