services:
  app:
    build: .
    image: gdns
    command: /docker-gdns
    ports:
      - "53:5555/udp"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    environment:
      - SQLITE_URL=/app/data/blocklist.db
      - SQLITE_BLOCKLIST=/app/data/blocked_domains.txt
      - REDIS_URL=redis:6379
      - UDP_PORT=:5555
    restart: unless-stopped

  test_fuzz:
    image: gdns
    command:
      [
        "/bin/sh",
        "-c",
        "go test ./test/fuzz/... -fuzz=FuzzParseAnswer -fuzztime=30s && go test ./test/fuzz/... -fuzz=FuzzDnsParse -fuzztime=30s",
      ]

  test_unit:
    image: gdns
    command: ["/bin/sh", "-c", "go test ./test/unit/... "]

  test_int:
    image: gdns
    command: ["/bin/sh", "-c", "go test ./test/integration/... "]
  test_fuzz:
    image: gdns
    command:
      [
        "/bin/sh",
        "-c",
        "go test ./test/fuzz/... -fuzz=FuzzParseAnswer -fuzztime=30s && go test ./test/fuzz/... -fuzz=FuzzDnsParse -fuzztime=30s",
      ]
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis:6379
